
name: Agentest CI Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agentest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agentest
        run: python -m pip install agentest-ai==3.6.1

      - name: Validate agent files
        run: agentest std validate --agents agents

      - name: Run Agentest security checks
        run: |
          agentest std run \
            --agents agents \
            --agent refill_bot_buggy \
            --mode strict \
            --format junit \
            --out agentest.xml \
            --strict

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentest-report
          path: agentest.xml
